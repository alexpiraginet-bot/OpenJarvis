# Jarvis — Life OS on Fly.io.
#
# Fly is the shortest path from this repo to a phone: it runs a stateful
# container, attaches a persistent volume for the SQLite database, and issues
# HTTPS on a public hostname automatically — which a PWA requires, because
# service workers, "add to home screen" and the microphone all refuse to work
# over plain HTTP on a remote origin.
#
# From the repository root:
#
#   fly launch --no-deploy --copy-config --config deploy/fly/fly.toml
#   fly volumes create life_data --size 1 --region gru
#   fly deploy --config deploy/fly/fly.toml
#
# No --dockerfile flag: [build] below already points at it, resolved relative
# to this file. Passing both invites them to disagree.
#
# `gru` is São Paulo — keep the data and the latency in the country whose
# clients this serves.
#
# Pick your own app name: it becomes <name>.fly.dev, and names are global.

app = "jarvis-life"
primary_region = "gru"

[build]
  dockerfile = "../docker/Dockerfile.life"

[env]
  OPENJARVIS_LIFE_HOST = "0.0.0.0"
  OPENJARVIS_LIFE_PORT = "8100"
  OPENJARVIS_LIFE_DB = "/data/life.db"
  # Registration stays closed; the first account on an empty database is
  # exempt, so you create yours on first open and nobody else can sign up.
  # Set to "1" only for an open beta.
  # OPENJARVIS_LIFE_OPEN_SIGNUP = "1"

[[mounts]]
  source = "life_data"
  destination = "/data"

[http_service]
  internal_port = 8100
  force_https = true
  # A personal assistant is idle most of the day. Stopping the machine when
  # nothing is in flight is the difference between cents and dollars a month;
  # min_machines_running = 1 keeps the first request of the morning fast.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[checks.health]
  type = "http"
  port = 8100
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  # The app holds no model in memory — it is FastAPI over SQLite. The smallest
  # shared VM is genuinely enough; scale up only if you measure a reason to.
  size = "shared-cpu-1x"
  memory = "512mb"
